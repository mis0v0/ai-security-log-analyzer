name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Locked Python 3.12 regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify and provision pinned uv and Python
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/ci_toolchain.py

      - name: Verify toolchain versions and dependency lock
        run: |
          test "$(uv --version | cut -d ' ' -f 2)" = "0.13.9"
          "$UV_PYTHON" -I -c "import sys; assert sys.version_info[:3] == (3, 12, 16)"
          uv lock --check

      - name: Install locked development environment
        run: uv sync --dev --locked --no-build --no-python-downloads --python "$UV_PYTHON"

      - name: Compile Python sources and tests
        run: uv run python -m compileall -q app tests main.py

      - name: Verify Linux checkpoint reset and process restart
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run pytest -q tests/test_checkpoint_epoch_reset.py tests/test_monitor_setup_runtime.py::test_two_reset_processes_do_not_share_approval_lock tests/test_monitor_setup_runtime.py::test_cli_explicit_checkpoint_reset_starts_a_new_epoch

      - name: Verify Linux SSH checkpoint recovery and process ownership
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run pytest -q tests/test_ssh_checkpoint_26_0.py
          uv run python tests/smoke_ssh_checkpoint_26_0.py

      - name: Verify Linux unified application and SSH setup management
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run pytest -q tests/test_monitor_setup_unified_30_2.py tests/test_monitor_setup_management.py tests/test_checkpoint_epoch_reset.py
          uv run python tests/smoke_unified_monitor_management_30_2.py

      - name: Verify bounded OpenAPI property pilot
        run: uv run pytest -q tests/test_schemathesis_api_pilot_23_5.py

      - name: Run complete regression
        run: uv run pytest -q

      - name: Verify bounded loopback TCP Syslog pilot on Linux
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run python tests/smoke_tcp_syslog_34_2.py

      - name: Verify bounded TCP Syslog reliability on Linux
        timeout-minutes: 5
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run python tests/accept_loopback_tcp_syslog_34_3.py --linux-bounded

      - name: Verify TCP Syslog management pilot on Linux
        timeout-minutes: 3
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run python tests/smoke_tcp_syslog_management_34_4.py

      - name: Verify collector JSONL runtime on Linux
        timeout-minutes: 5
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run python tests/accept_collector_jsonl_runtime_35_3a.py

      - name: Verify restricted analyst report on Linux
        run: |
          uv run python -c "import sys; assert sys.platform == 'linux'"
          uv run python tests/smoke_restricted_report_33_5c.py

      - name: Measure bounded synthetic report export on Linux
        run: TZ=UTC uv run python tests/benchmark_restricted_report_33_5b.py

      - name: Install pinned Node for development-only accessibility checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          package-manager-cache: false

      - name: Install locked Node test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Provision pinned Google Chrome without package scripts
        env:
          TEST_CHROME_DIR: ${{ runner.temp }}/asla-chrome
        run: |
          umask 077
          mkdir "$TEST_CHROME_DIR"
          python3 -I - "$TEST_CHROME_DIR/chrome.deb" <<'PYTHON'
          from hashlib import sha256
          from pathlib import Path
          from sys import argv
          from urllib.request import urlopen

          url = "https://dl.google.com/linux/chrome/deb/pool/main/g/google-chrome-stable/google-chrome-stable_158.0.8127.36-1_amd64.deb"
          size = 152702276
          expected = "4696bce00b128f385a870ba2eb6eede61698f22374ea0d8e09af8a1c6543d397"
          with urlopen(url, timeout=30) as response:
              package = response.read(size + 1)
          if len(package) != size or sha256(package).hexdigest() != expected:
              raise SystemExit("Chrome package integrity check failed")
          with Path(argv[1]).open("xb") as output:
              output.write(package)
          PYTHON
          dpkg-deb --extract "$TEST_CHROME_DIR/chrome.deb" "$TEST_CHROME_DIR"
          test -x "$TEST_CHROME_DIR/opt/google/chrome/chrome"

      - name: Run bounded Chromium accessibility pilot
        env:
          ASLA_TEST_CHROME: ${{ runner.temp }}/asla-chrome/opt/google/chrome/chrome
          TZ: UTC
        run: npm run test:a11y --silent

      - name: Verify tests did not modify tracked files
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
